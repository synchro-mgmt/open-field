<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="sunGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#fff9c4"/>
      <stop offset="40%" stop-color="#fdd835"/>
      <stop offset="100%" stop-color="#f9a825"/>
    </radialGradient>
    <linearGradient id="petalGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdd835"/>
      <stop offset="100%" stop-color="#f9a825"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbc02d"/>
      <stop offset="100%" stop-color="#f57f17"/>
    </linearGradient>
  </defs>

  <!-- Orbit circle -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#fbc02d" stroke-width="8" opacity="0.85"/>

  <!-- Small planet on orbit -->
  <circle cx="138" cy="68" r="16" fill="#fbc02d"/>

  <!-- Petals (5 rays behind sun) -->
  <!-- Center petal -->
  <ellipse cx="256" cy="150" rx="22" ry="70" fill="url(#petalGrad)"/>
  <!-- Left petals -->
  <ellipse cx="256" cy="150" rx="22" ry="70" fill="url(#petalGrad)" transform="rotate(-30 256 240)"/>
  <ellipse cx="256" cy="150" rx="22" ry="70" fill="url(#petalGrad)" transform="rotate(-60 256 240)"/>
  <!-- Right petals -->
  <ellipse cx="256" cy="150" rx="22" ry="70" fill="url(#petalGrad)" transform="rotate(30 256 240)"/>
  <ellipse cx="256" cy="150" rx="22" ry="70" fill="url(#petalGrad)" transform="rotate(60 256 240)"/>

  <!-- Sun core -->
  <circle cx="256" cy="240" r="80" fill="url(#sunGlow)"/>

  <!-- Wave 1 (upper) -->
  <path d="M130,340 Q256,270 382,340 Q256,310 130,340 Z" fill="url(#waveGrad)"/>

  <!-- Wave 2 (lower) -->
  <path d="M100,390 Q256,310 412,390 Q256,355 100,390 Z" fill="url(#waveGrad)"/>
</svg>