<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>open-field — 命のフィールドを世界に開く</title>
<link rel="icon" type="image/svg+xml" href="/open-field/assets/favicon.svg">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&family=Zen+Maru+Gothic:wght@400;500;700&display=swap');
  :root {
    --navy: #0a1628; --navy-mid: #132040;
    --gold: #f0d9a8; --indigo: #4f46e5;
    --bg: #faf9f7; --card: #ffffff;
    --text: #1a1a2e; --text-sub: #64748b; --border: #e2e8f0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Noto Sans JP', -apple-system, sans-serif; background: var(--bg); color: var(--text); line-height: 1.8; -webkit-font-smoothing: antialiased; min-height: 100vh; }
  .hero { background: linear-gradient(160deg, var(--navy) 0%, var(--navy-mid) 60%, #1b2d4f 100%); color: #fff; padding: 100px 40px 80px; text-align: center; position: relative; overflow: hidden; }
  .hero::before { content: ''; position: absolute; top: -40%; right: -15%; width: 500px; height: 500px; background: radial-gradient(circle, rgba(243,156,18,0.08) 0%, transparent 70%); border-radius: 50%; }
  .hero-inner { position: relative; z-index: 1; }
  .hero-badge { display: inline-block; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); padding: 6px 20px; border-radius: 30px; font-size: 0.78em; font-weight: 500; letter-spacing: 0.1em; margin-bottom: 20px; color: var(--gold); }
  .hero h1 { font-family: 'Zen Maru Gothic', sans-serif; font-size: 2.8em; font-weight: 700; margin-bottom: 12px; letter-spacing: 0.06em; }
  .hero .subtitle { font-size: 1.05em; opacity: 0.6; font-weight: 300; max-width: 480px; margin: 0 auto; letter-spacing: 0.04em; }
  .content { max-width: 800px; margin: -50px auto 0; padding: 0 24px 60px; position: relative; z-index: 2; }
  .card-link { display: block; background: var(--card); border-radius: 24px; padding: 40px 36px; border: 1px solid var(--border); box-shadow: 0 8px 32px rgba(0,0,0,0.06); transition: all 0.3s ease; text-decoration: none; color: var(--text); margin-bottom: 24px; }
  .card-link:hover { box-shadow: 0 12px 40px rgba(0,0,0,0.1); transform: translateY(-4px); }
  .card-link.story { border-left: 5px solid var(--indigo); }
  .card-link.roadmap { border-left: 5px solid #f39c12; }
  .card-emoji { font-size: 2.4em; margin-bottom: 12px; }
  .card-link h2 { font-family: 'Zen Maru Gothic', sans-serif; font-size: 1.4em; font-weight: 700; margin-bottom: 10px; }
  .card-link.story h2 { color: #3730a3; }
  .card-link.roadmap h2 { color: #92400e; }
  .card-link p { font-size: 0.92em; color: var(--text-sub); line-height: 1.8; max-width: 560px; }
  .card-tag { display: inline-block; font-size: 0.78em; font-weight: 600; padding: 5px 18px; border-radius: 20px; margin-top: 16px; }
  .card-link.story .card-tag { background: rgba(79,70,229,0.1); color: var(--indigo); }
  .card-link.roadmap .card-tag { background: rgba(243,156,18,0.1); color: #b45309; }
  .portal-footer { text-align: center; padding: 48px 24px; font-size: 0.8em; color: var(--text-sub); border-top: 1px solid var(--border); max-width: 800px; margin: 0 auto; }
  .portal-footer strong { color: var(--text); font-weight: 600; }
  @media (max-width: 640px) {
    .hero { padding: 80px 24px 60px; }
    .hero h1 { font-size: 2em; }
    .content { padding: 0 16px 40px; }
    .card-link { padding: 28px 24px; }
  }
</style>
</head>
<body>
<div class="hero">
  <div class="hero-inner">
    <div class="hero-badge">SYNCHRO MANAGEMENT</div>
    <h1>open-field</h1>
    <div class="subtitle">命のフィールドを世界に開く</div>
  </div>
</div>
<div class="content">
  <a href="dashboards/financial-story.html" class="card-link story">
    <div class="card-emoji">🦋</div>
    <h2>サナギから羽化するまで</h2>
    <p>経理ゼロの起業家が、お金の仕組みを「自分の言葉」で理解するまでの物語。5つの発見と、仕組みが動き出す感覚の記録。</p>
    <span class="card-tag">ストーリーを読む →</span>
  </a>
  <a href="dashboards/financial-roadmap.html" class="card-link roadmap">
    <div class="card-emoji">💰</div>
    <h2>財務マネジメント設計</h2>
    <p>サブスク中心モデルv4。北原式を統合した財務管理の全体設計。6つの視点で会社の財務を可視化。</p>
    <span class="card-tag">設計書を見る →</span>
  </a>
</div>
<div class="portal-footer">
  <strong>open-field</strong> — 株式会社シンクロニシティ・マネジメント<br>
  Managed by こあ(COA) | Powered by GitHub Pages
</div>
</body>
</html>
